name: Sync XDAO Daily Report JSON

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "Report date (YYYY-MM-DD)"
        required: true
        default: "2026-08-03"
  schedule:
    - cron: "30 15 * * *"

permissions:
  contents: write

jobs:
  sync-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve report date
        id: date
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REPORT_DATE="${{ inputs.report_date }}"
          else
            # 15:30 UTC = 22:30 Vietnam time (UTC+7)
            REPORT_DATE="$(TZ=Asia/Ho_Chi_Minh date +%F)"
          fi

          if [[ ! "$REPORT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid date: $REPORT_DATE"
            exit 1
          fi

          echo "report_date=$REPORT_DATE" >> "$GITHUB_OUTPUT"

      - name: Fetch report JSON
        shell: bash
        run: |
          set -euo pipefail
          DATE="${{ steps.date.outputs.report_date }}"
          mkdir -p reports

          URL="https://xdao-report-api.netlify.app/api/report?date=${DATE}"
          TMP="$(mktemp)"

          curl --fail --location \
            --retry 4 \
            --retry-delay 3 \
            --connect-timeout 20 \
            --max-time 120 \
            -H "Accept: application/json" \
            "$URL" \
            -o "$TMP"

          python - "$TMP" "$DATE" <<'PY'
          import json, sys
          path, expected_date = sys.argv[1], sys.argv[2]
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if data.get("success") is not True:
              raise SystemExit("API success is not true")
          if data.get("report_date") != expected_date:
              raise SystemExit(
                  f"Date mismatch: expected {expected_date}, got {data.get('report_date')}"
              )

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

          mv "$TMP" "reports/${DATE}.json"

      - name: Commit report snapshot
        shell: bash
        run: |
          DATE="${{ steps.date.outputs.report_date }}"
          git config user.name "xdao-report-bot"
          git config user.email "xdao-report-bot@users.noreply.github.com"
          git add "reports/${DATE}.json"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Sync report ${DATE}"
          git push
